$kind: http-request
url: "{{baseUrl}}/workout-labels"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{labelName}}",
      "color": "#22c55e"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 409', function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 2000
