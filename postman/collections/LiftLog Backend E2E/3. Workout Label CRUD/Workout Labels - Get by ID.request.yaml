$kind: http-request
url: "{{baseUrl}}/workout-labels/{{createdLabelId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test('returns requested label', function () {
        pm.expect(data.id).to.eql(pm.environment.get('createdLabelId'));
      });
    language: text/javascript
order: 4000
