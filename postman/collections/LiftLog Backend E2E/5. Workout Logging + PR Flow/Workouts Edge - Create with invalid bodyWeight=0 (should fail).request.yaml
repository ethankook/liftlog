$kind: http-request
url: "{{baseUrl}}/workouts"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Invalid Workout",
      "bodyWeight": 0
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 2000
