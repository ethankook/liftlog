$kind: http-request
url: "{{baseUrl}}/workouts/{{workoutId}}/exercises/reorder"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "orderedIds": ["{{workoutExerciseId}}"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const rows = pm.response.json();
      pm.test('reorder response is array', function () {
        pm.expect(rows).to.be.an('array').that.has.lengthOf(1);
      });
    language: text/javascript
order: 13000
