$kind: http-request
url: "{{baseUrl}}/workouts/{{workoutId}}/exercises"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "exerciseId": "{{exerciseId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 201', function () { pm.response.to.have.status(201); });
      const data = pm.response.json();
      pm.test('workout exercise created', function () {
        pm.expect(data).to.have.property('id');
        pm.expect(data).to.have.property('exerciseId');
      });
      pm.environment.set('workoutExerciseId', data.id);
    language: text/javascript
order: 6000
