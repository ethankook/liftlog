$kind: http-request
url: "{{baseUrl}}/workout-labels"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const rows = pm.response.json();
      pm.test('returns array', function () { pm.expect(rows).to.be.an('array'); });
    language: text/javascript
order: 5000
