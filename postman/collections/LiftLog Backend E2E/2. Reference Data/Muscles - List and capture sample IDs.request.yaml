$kind: http-request
url: "{{baseUrl}}/muscles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const rows = pm.response.json();
      pm.test('muscles returned', function () {
        pm.expect(rows).to.be.an('array').that.is.not.empty;
      });
      const primary = rows[0];
      const secondary = rows.length > 1 ? rows[1] : rows[0];
      pm.environment.set('primaryMuscleId', primary.id);
      pm.environment.set('secondaryMuscleId', secondary.id);
    language: text/javascript
order: 3000
