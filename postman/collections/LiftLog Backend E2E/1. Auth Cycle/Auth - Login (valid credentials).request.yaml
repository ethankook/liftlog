$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{adminUsername}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test('token pair and user are returned', function () {
        pm.expect(data).to.have.property('accessToken');
        pm.expect(data).to.have.property('refreshToken');
        pm.expect(data).to.have.property('user');
        pm.expect(data.user).to.have.property('id');
        pm.expect(data.user).to.have.property('username');
      });
      pm.environment.set('accessToken', data.accessToken);
      pm.environment.set('refreshToken', data.refreshToken);
      pm.environment.set('userId', data.user.id);
      pm.environment.set('username', data.user.username);
    language: text/javascript
order: 1000
