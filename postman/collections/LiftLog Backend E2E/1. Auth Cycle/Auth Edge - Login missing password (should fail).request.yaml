$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{adminUsername}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 6000
