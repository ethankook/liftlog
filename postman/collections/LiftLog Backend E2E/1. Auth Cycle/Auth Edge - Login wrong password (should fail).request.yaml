$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{adminUsername}}",
      "password": "{{wrongPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 7000
