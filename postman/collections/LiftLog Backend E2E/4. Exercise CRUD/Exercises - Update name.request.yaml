$kind: http-request
url: "{{baseUrl}}/exercises/{{exerciseId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "{{exerciseNameUpdated}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test('name updated', function () {
        pm.expect(data.name).to.eql(pm.environment.get('exerciseNameUpdated'));
      });
    language: text/javascript
order: 4000
