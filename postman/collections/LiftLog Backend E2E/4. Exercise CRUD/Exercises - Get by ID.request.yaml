$kind: http-request
name: Exercises - Get by ID
url: "{{baseUrl}}/exercises/{{exerciseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const data = pm.response.json();
      pm.test('returns requested exercise', function () {
        pm.expect(data.id).to.eql(pm.environment.get('exerciseId'));
      });
    language: text/javascript
order: 3000
