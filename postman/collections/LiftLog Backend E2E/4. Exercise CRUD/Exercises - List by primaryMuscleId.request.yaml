$kind: http-request
url: "{{baseUrl}}/exercises?primaryMuscleId={{primaryMuscleId}}"
method: GET
queryParams:
  primaryMuscleId: "{{primaryMuscleId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const rows = pm.response.json();
      pm.test('created exercise is returned', function () {
        pm.expect(rows.some((r) => r.id === pm.environment.get('exerciseId'))).to.eql(true);
      });
    language: text/javascript
order: 2000
