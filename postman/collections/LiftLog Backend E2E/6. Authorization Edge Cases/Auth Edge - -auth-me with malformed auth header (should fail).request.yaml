$kind: http-request
name: Auth Edge - /auth/me with malformed auth header (should fail)
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Authorization: Token abc123
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('status is 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
