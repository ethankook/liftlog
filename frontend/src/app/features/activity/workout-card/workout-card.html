<div
  class="card"
  [class.card--grid]="variant === 'grid'"
  [class.card--row]="variant === 'row'"
  (click)="select.emit(workout.id)"
>
  <h2> {{ workout.title }}</h2>

  @if (workout.label) {
    <span
      class="label-name"
      [style.background-color]=workout.label.color
    >
    {{ workout.label.name}}
  </span>

  }

<p>{{ workout.dateTime | date:'mediumDate' }}</p>
</div>
