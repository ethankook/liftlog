<div
  class="card"
  [class.card--grid]="variant === 'grid'"
  [class.card--row]="variant === 'row'"
  (click)="select.emit(workout.id)"
>
  <h2>{{ workout.title }}</h2>
  <div class="meta">
    <app-chip [label]="(workout.dateTime | date:'mediumDate') ?? ''" />
    @if (workout.label) {
      <app-chip [label]="workout.label.name" [bgColor]="workout.label.color" />
    }
  </div>
</div>
