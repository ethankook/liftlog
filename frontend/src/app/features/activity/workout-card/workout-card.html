<div
  class="card"
  [class.card--grid]="variant === 'grid'"
  [class.card--row]="variant === 'row'"
  (click)="select.emit(workout.id)"
  [style.--color-border]="getWorkoutLabel(workout.label).color"
>
  <h2>{{ workout.title }}</h2>
  <div class="meta">
    <app-chip [label]="(workout.dateTime | date:'mediumDate') ?? ''" />
    <app-chip
      [label]="getWorkoutLabel(workout.label).name"
      [bgColor]="getWorkoutLabel(workout.label).color"
    />
  </div>
</div>
