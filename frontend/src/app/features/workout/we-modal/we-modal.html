<app-modal [title]="workoutExercise.exercise.name" (close)="close.emit()">
  @if (loading()) {
    <p>Loading...</p>
  } @else {
    <div
      class="card-list card-list--row"
      cdkDropList
      [cdkDropListDisabled]="editingSetId() !== null"
      (cdkDropListDropped)="onSetDrop($event)"
    >
      @for (set of sets(); track set.id) {
        @if (editingSetId() === set.id) {
          <app-set-edit-form
            [set]="set"
            [fieldLabels]="trackedFieldLabels()"
            [busy]="pendingSetId() === set.id"
            (save)="onSetSave($event)"
            (cancel)="onSetCancel(set.id)"
            (delete)="onSetDelete($event)"
          />
        } @else {
          <app-set-card
            cdkDrag
            cdkDragLockAxis="y"
            variant="row"
            [set]="set"
            [fieldLabels]="trackedFieldLabels()"
            (select)="editingSetId.set($event)"
          />
        }
      } @empty {
        <p>No sets logged yet.</p>
      }
    </div>
    @if (!editingSetId()) {
      <app-button variant="create" label="Add Set" (action)="addSet()" />

    }
  }
</app-modal>
