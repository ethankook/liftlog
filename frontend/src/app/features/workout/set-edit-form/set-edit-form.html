<div class="card card--row">
  @for (entry of localValues | keyvalue; track entry.key) {
    <label>
      {{ fieldLabels[entry.key] ?? entry.key }}
      <input type="number" [value]="entry.value" (blur)="onValueChange(entry.key, $event)" />
    </label> <br>
  }

  <label>
    Notes
    <textarea [value]="localNotes" (blur)="onNotesChange($event)"></textarea>
  </label> <br>

  <app-button variant="update" label="Save" (action)="save.emit({
    setId: set.id,
    values: localValues,
    notes: localNotes
  })" />
  <app-button variant="delete" label="Delete" (action)="delete.emit(set.id)" />
  <app-button variant="cancel" label="Cancel" (action)="cancel.emit()" />
</div>
