<div class="card card--row">
  @for (entry of localValues | keyvalue; track entry.key) {
    <label>
      {{ fieldLabels[entry.key] ?? entry.key }}
      <input
        type="number"
        [value]="entry.value"
        [disabled]="busy"
        (input)="onValueChange(entry.key, $event)"
      />
    </label> <br>
  }

  <label>
    Notes
    <textarea [value]="localNotes" [disabled]="busy" (input)="onNotesChange($event)"></textarea>
  </label> <br>

  <app-button variant="update" label="Save" [disabled]="busy" (action)="onSave()" />
  <app-button variant="delete" label="Delete" [disabled]="busy" (action)="onDelete()" />
  <app-button variant="cancel" label="Cancel" [disabled]="busy" (action)="cancel.emit()" />
</div>
