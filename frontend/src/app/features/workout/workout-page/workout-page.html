@if (loading()) {
  <p>Loading...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (workout(); as w) {
  <app-back-to-tab />

  <section class="header">
    <div class="header-meta">
      <app-chip [label]="(w.dateTime | date:'mediumDate') ?? ''" />
      <app-chip
        [label]="getWorkoutLabel(w.label).name"
        [bgColor]="getWorkoutLabel(w.label).color"
      />
    </div>
    <input class="title-input" type="text" [value]="w.title" (blur)="updateField('title', $event)" />
    <div class="header-fields">
      <label>
        Body Weight
        <input type="number" [value]="w.bodyWeight" (blur)="updateField('bodyWeight', $event)" />
      </label>
      <label>
        Notes
        <textarea [value]="w.notes ?? ''" (blur)="updateField('notes', $event)"></textarea>
      </label>
    </div>
  </section>

@if (addModalOpen()) {
  <app-add-workout-exercise-modal [workoutId]="w.id" (close)="addModalOpen.set(false)" (added)="onExerciseAdded($event)" />
}
@if (selectedWorkoutExercise()) {
  <app-we-modal
    [workoutExercise]="selectedWorkoutExercise()!"
    [workoutId]="workoutId"
    (workoutExerciseChange)="onWorkoutExerciseChange($event)"
    (close)="onWeModalClose()"
  />
}
  <section
    class="card-list card-list--row"
    cdkDropList
    (cdkDropListDropped)="onExerciseDrop($event)"
  >
    <h2>Exercises</h2>
    @for (we of w.workoutExercises; track we.id) {
      <app-workout-exercise-card
        cdkDrag
        cdkDragLockAxis="y"
        variant="row"
        [workoutExercise]="we"
        (select)="onExerciseSelect($event)"
        (delete)="onExerciseDelete($event)"
      />
    } @empty {
      <p>No exercises added yet.</p>
    }
  </section>
  <app-button variant="create" label="Add Exercise" (action)="onAddExercise()" />
  <app-button variant="delete" label="Delete Workout" (action)="onDeleteWorkout()" />

}
