<app-modal title="Add Exercise" (close)="close.emit()">

  <div class="card-list card-list--grid">
    @for (exercise of exercises(); track exercise.id) {
      <app-exercise-card variant="grid" [exercise]="exercise" [selected]="isSelected(exercise.id)" (select)="toggleSelection($event)" />
    }
  </div>



  <app-button variant="create" label="Add Exercise" (action)="added.emit(selectedExercises())" />
</app-modal>
