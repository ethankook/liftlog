<nav>
  <a routerLink="/dashboard" [class.active]="navigation.isTabActive('dashboard')">Dashboard</a>
  <a routerLink="/activity" [class.active]="navigation.isTabActive('activity')">Activity</a>
  <a href="" class="create-trigger" [class.active]="createWheelOpen()" (click)="toggleCreateWheel($event)">+</a>
  <a routerLink="/stats" [class.active]="navigation.isTabActive('stats')">Stats</a>
  <a routerLink="/settings" [class.active]="navigation.isTabActive('settings')">Settings</a>
</nav>

@if (createWheelOpen()) {
  <app-half-wheel (close)="closeCreateWheel()" (selectAction)="onCreateAction($event)" />
}
