services:
  postgres:
    image: postgres:16
    container_name: liftlog-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - liftlog-postgres-data:/var/lib/postgresql/data

volumes:
  liftlog-postgres-data:
